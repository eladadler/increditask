<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>יום הולדת שמח זאבי ✦</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Noto+Serif+Hebrew:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100dvh;overflow-x:hidden}
    body{font-family:'Rubik',sans-serif;background:#fffcf4;color:#1a0e04;direction:rtl}

    /* ===== SURPRISE SCREEN ===== */
    #surprise{
      position:fixed;inset:0;z-index:999;
      background:radial-gradient(ellipse at center,#1a0a2e 0%,#0a0015 100%);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      cursor:pointer;user-select:none;
      transition:opacity .8s ease;
    }
    #surprise.hiding{opacity:0;pointer-events:none}
    #surprise canvas{position:absolute;inset:0;width:100%;height:100%}
    .surprise-content{position:relative;z-index:2;text-align:center;padding:20px}
    .s-num{
      font-family:'Noto Serif Hebrew',serif;
      font-size:clamp(90px,28vw,180px);font-weight:900;line-height:1;
      color:#ffd700;
      text-shadow:0 0 40px rgba(255,215,0,.6),0 0 80px rgba(255,180,0,.3);
      animation:numPulse 2s ease-in-out infinite alternate;
    }
    @keyframes numPulse{from{text-shadow:0 0 40px rgba(255,215,0,.6),0 0 80px rgba(255,180,0,.3)}to{text-shadow:0 0 60px rgba(255,215,0,.9),0 0 120px rgba(255,200,0,.5)}}
    .s-title{
      font-family:'Noto Serif Hebrew',serif;
      font-size:clamp(22px,6vw,38px);font-weight:700;color:#fff;
      margin-top:10px;margin-bottom:6px;
      text-shadow:0 2px 20px rgba(255,215,0,.4);
    }
    .s-name{
      font-family:'Noto Serif Hebrew',serif;
      font-size:clamp(32px,9vw,64px);font-weight:900;
      color:#ffd700;
      text-shadow:0 0 30px rgba(255,215,0,.5);
      margin-bottom:32px;
    }
    .s-tap{
      display:inline-flex;align-items:center;gap:10px;
      background:rgba(255,215,0,.15);
      border:1.5px solid rgba(255,215,0,.5);
      color:#ffd700;border-radius:50px;
      padding:14px 30px;font-size:16px;font-family:'Rubik',sans-serif;
      animation:tapBounce 1.6s ease-in-out infinite;
      backdrop-filter:blur(6px);
    }
    @keyframes tapBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

    /* confetti */
    #confetti{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
    .dot{position:absolute;border-radius:50%;animation:twinkle var(--d,3s) ease-in-out infinite alternate}
    @keyframes twinkle{from{opacity:.05}to{opacity:.3}}

    /* hero */
    .hero{position:relative;z-index:1;text-align:center;padding:48px 20px 28px}
    .hero-sparkle{font-size:16px;color:#c8900a;letter-spacing:12px;opacity:.6;display:block;margin-bottom:14px}
    .hero-title{font-family:'Noto Serif Hebrew',serif;font-size:clamp(18px,4.5vw,30px);font-weight:700;color:#8a5e08;margin-bottom:2px}
    .hero-num{font-family:'Noto Serif Hebrew',serif;font-size:clamp(64px,20vw,128px);font-weight:900;line-height:1;color:#c8900a;display:block;margin:0 auto 2px;text-shadow:0 4px 32px rgba(200,144,10,.18)}
    .hero-name{font-family:'Noto Serif Hebrew',serif;font-size:clamp(28px,8vw,56px);font-weight:900;color:#6a4008;line-height:1.2;margin-bottom:8px}
    .hero-sub{font-size:13.5px;color:#b07830;opacity:.6;letter-spacing:.5px}
    .hero-line{display:block;width:60px;height:1.5px;background:linear-gradient(90deg,transparent,rgba(200,144,10,.35),transparent);margin:18px auto 0}

    /* viewer */
    .viewer{position:relative;z-index:1;padding:28px 20px 60px;max-width:560px;margin:0 auto}

    /* stacked pages illusion */
    .pages-wrap{position:relative}
    .pages-wrap::before,.pages-wrap::after{content:'';position:absolute;border-radius:20px}
    .pages-wrap::before{inset:5px -5px -5px 5px;z-index:-1;background:#ede0bf}
    .pages-wrap::after{inset:9px -9px -9px 9px;z-index:-2;background:#e8d8b0}

    /* stage: the 3D viewport */
    .stage{position:relative}

    /* card */
    .book-card{
      position:relative;
      background:#fff;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 8px 48px rgba(150,90,0,.16),0 2px 8px rgba(150,90,0,.08);
      border-top:4px solid #c8900a;
    }

    /* page-flip animation on the outgoing card */
    .page-out-next{
      position:absolute;inset:0;z-index:5;
      backface-visibility:hidden;
      transform-origin:right center;
      animation:pageOutNext .65s cubic-bezier(.4,0,.55,1) forwards;
    }
    .page-out-prev{
      position:absolute;inset:0;z-index:5;
      backface-visibility:hidden;
      transform-origin:left center;
      animation:pageOutPrev .65s cubic-bezier(.4,0,.55,1) forwards;
    }

    @keyframes pageOutNext{
      0%  {transform:perspective(1200px) rotateY(0deg);}
      48% {transform:perspective(1200px) rotateY(90deg);}
      100%{transform:perspective(1200px) rotateY(175deg);opacity:0;}
    }
    @keyframes pageOutPrev{
      0%  {transform:perspective(1200px) rotateY(0deg);}
      48% {transform:perspective(1200px) rotateY(-90deg);}
      100%{transform:perspective(1200px) rotateY(-175deg);opacity:0;}
    }

    /* shadow that fades as the new card is revealed */
    @keyframes revealShadow{from{opacity:1}to{opacity:0}}
    .reveal-shadow{
      position:absolute;inset:0;border-radius:20px;pointer-events:none;z-index:3;
      background:rgba(0,0,0,.18);
      animation:revealShadow .65s ease-out forwards;
    }

    /* card content */
    .card-media-wrap{overflow:hidden}
    .card-media{width:100%;display:block;object-fit:cover;max-height:320px}
    video.card-media{background:#f5e8cc}
    .card-body{padding:22px 22px 26px}
    .card-sender{font-family:'Noto Serif Hebrew',serif;font-size:16px;font-weight:700;color:#c8900a;margin-bottom:10px;display:flex;align-items:center;gap:8px}
    .card-sender::before{content:'✦';font-size:9px;opacity:.7;flex-shrink:0}
    .card-msg{font-size:15px;line-height:1.78;color:#3a2408;white-space:pre-wrap;word-break:break-word}

    /* counter strip */
    .counter-strip{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:14px}
    .counter-dot{width:7px;height:7px;border-radius:50%;background:rgba(200,144,10,.2);transition:background .3s,transform .3s}
    .counter-dot.active{background:#c8900a;transform:scale(1.3)}

    /* navigation */
    .nav{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:22px}
    .nav-btn{
      width:48px;height:48px;border-radius:50%;
      border:1.5px solid rgba(200,144,10,.35);
      background:#fff;color:#c8900a;font-size:22px;
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      transition:background .15s,border-color .15s,transform .1s;
      box-shadow:0 2px 12px rgba(150,90,0,.1);
      user-select:none;
    }
    .nav-btn:hover:not(:disabled){background:#fffbf0;border-color:#c8900a;transform:scale(1.06)}
    .nav-btn:active:not(:disabled){transform:scale(.95)}
    .nav-btn:disabled{opacity:.22;cursor:not-allowed}
    .nav-num{font-size:13px;color:#b07030;min-width:52px;text-align:center;font-weight:500}

    /* loading */
    .loader{position:relative;z-index:1;text-align:center;padding:80px 20px}
    .loader-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c8900a;margin:0 4px;animation:bounce 1.2s ease-in-out infinite}
    .loader-dot:nth-child(2){animation-delay:.2s}
    .loader-dot:nth-child(3){animation-delay:.4s}
    @keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.3}40%{transform:scale(1.1);opacity:1}}
    .empty{position:relative;z-index:1;text-align:center;padding:60px 20px;color:#c8a060;font-size:15px}
  </style>
</head>
<body>
<div id="surprise">
  <canvas id="fw-canvas"></canvas>
  <div class="surprise-content">
    <div class="s-num">35</div>
    <div class="s-title">יום הולדת שמח</div>
    <div class="s-name">זאבי! 🎉</div>
    <div class="s-tap">✨ לחץ לגלות את ההפתעה ✨</div>
  </div>
</div>

<div id="confetti"></div>

<div class="hero">
  <span class="hero-sparkle">✦ ✦ ✦</span>
  <div class="hero-title">יום הולדת שמח</div>
  <span class="hero-num">35</span>
  <div class="hero-name">זאבי</div>
  <div class="hero-sub">מאוהביו ומחבריו</div>
  <span class="hero-line"></span>
</div>

<div id="loader" class="loader">
  <div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div>
</div>

<div class="viewer" id="viewer" style="display:none">
  <div class="counter-strip" id="dots"></div>
  <div class="pages-wrap">
    <div class="stage" id="stage"></div>
  </div>
  <div class="nav">
    <button class="nav-btn" id="btn-prev" onclick="navigate(-1)" aria-label="הקודם">‹</button>
    <span class="nav-num" id="nav-num"></span>
    <button class="nav-btn" id="btn-next" onclick="navigate(1)" aria-label="הבא">›</button>
  </div>
</div>
<div class="empty" id="empty" style="display:none">עוד אין ברכות — הן בדרך ✦</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="zeev.js?v=2"></script>
<script>
/* confetti */
(function(){
  const c=document.getElementById('confetti');
  const colors=['#c8900a','#e8b820','#8a5e08','#d4a830','#f0cc60'];
  for(let i=0;i<55;i++){
    const d=document.createElement('div'); d.className='dot';
    const sz=2+Math.random()*3.5;
    d.style.cssText=`left:${Math.random()*100}vw;top:${Math.random()*100}vh;width:${sz}px;height:${sz}px;background:${colors[i%colors.length]};--d:${2+Math.random()*5}s;animation-delay:${Math.random()*5}s`;
    c.appendChild(d);
  }
})();

let blessings=[], idx=0, busy=false;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]]}return a;}

function buildCard(b){
  const card=document.createElement('div'); card.className='book-card';
  if(b.media_url){
    const mw=document.createElement('div'); mw.className='card-media-wrap';
    if(b.media_type==='video'){
      const v=document.createElement('video');
      v.className='card-media'; v.src=b.media_url;
      v.setAttribute('muted',''); v.setAttribute('playsinline',''); v.setAttribute('controls',''); v.setAttribute('preload','metadata');
      mw.appendChild(v);
    } else {
      const img=document.createElement('img');
      img.className='card-media'; img.src=b.media_url; img.alt='תמונה'; img.loading='lazy';
      mw.appendChild(img);
    }
    card.appendChild(mw);
  }
  const body=document.createElement('div'); body.className='card-body';
  const name=document.createElement('div'); name.className='card-sender'; name.textContent=b.name;
  body.appendChild(name);
  if(b.message){const m=document.createElement('div'); m.className='card-msg'; m.textContent=b.message; body.appendChild(m);}
  card.appendChild(body);
  return card;
}

function updateUI(){
  document.getElementById('nav-num').textContent=(idx+1)+' / '+blessings.length;
  document.getElementById('btn-prev').disabled=blessings.length<=1;
  document.getElementById('btn-next').disabled=blessings.length<=1;
  const max=Math.min(blessings.length,12);
  const dots=document.getElementById('dots');
  dots.innerHTML='';
  if(blessings.length>1){
    for(let i=0;i<max;i++){
      const d=document.createElement('div'); d.className='counter-dot'+(i===idx%max?' active':'');
      dots.appendChild(d);
    }
  }
}

function showCard(){
  const stage=document.getElementById('stage');
  stage.innerHTML='';
  stage.appendChild(buildCard(blessings[idx]));
  updateUI();
}

function navigate(dir){
  if(busy||blessings.length<=1) return;
  busy=true;

  const stage=document.getElementById('stage');
  const curCard=stage.firstChild;
  if(!curCard){busy=false;return;}

  const newIdx=(idx+dir+blessings.length)%blessings.length;

  /* 1. lock stage height to prevent layout jump */
  stage.style.height=curCard.offsetHeight+'px';

  /* 2. build new card (placed first = visually behind curCard) */
  const newCard=buildCard(blessings[newIdx]);

  /* 3. add fading shadow overlay on new card so it looks revealed */
  const shd=document.createElement('div'); shd.className='reveal-shadow';
  newCard.appendChild(shd);
  stage.insertBefore(newCard, curCard);

  /* 4. lift curCard to absolute so it floats over newCard */
  curCard.style.position='absolute';
  curCard.style.top='0'; curCard.style.left='0'; curCard.style.right='0';
  curCard.style.zIndex='5';

  /* 5. flip curCard away */
  requestAnimationFrame(()=>{
    curCard.classList.add(dir>0?'page-out-next':'page-out-prev');
  });

  /* 6. after flip: clean up, settle into new card */
  setTimeout(()=>{
    idx=newIdx;
    curCard.remove();
    shd.remove();
    newCard.style.cssText=''; /* restore to normal flow */
    stage.style.height='';
    updateUI();
    busy=false;
  }, 680);
}

async function load(){
  try{
    const data=shuffle(await ZeevApp.loadBlessings());
    document.getElementById('loader').style.display='none';
    if(!data.length){document.getElementById('empty').style.display='block';return;}
    blessings=data;
    document.getElementById('viewer').style.display='block';
    showCard();
  }catch(e){
    document.getElementById('loader').innerHTML='<span style="color:#c04020;font-size:14px">שגיאה: '+e.message+'</span>';
  }
}

/* keyboard */
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') navigate(1);
  if(e.key==='ArrowRight') navigate(-1);
});

/* swipe */
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50) navigate(dx<0?1:-1);
},{passive:true});

/* ===== FIREWORKS ===== */
(function(){
  const el=document.getElementById('surprise');
  if(!el) return;

  /* skip if already seen */
  try{ if(localStorage.getItem('zeev-seen')){ el.remove(); load(); return; } }catch(e){}

  const canvas=document.getElementById('fw-canvas');
  const ctx=canvas.getContext('2d');
  let W,H,particles=[],rockets=[];

  function resize(){ W=canvas.width=canvas.offsetWidth; H=canvas.height=canvas.offsetHeight; }
  resize(); window.addEventListener('resize',resize);

  const COLORS=['#ffd700','#ff6b6b','#4ecdc4','#a8e6cf','#ff8b94','#ffaaa5','#ffd3b6','#ffffff','#c3a5ff'];

  function spawnRocket(){
    rockets.push({
      x: W*(.15+Math.random()*.7),
      y: H,
      tx: W*(.1+Math.random()*.8),
      ty: H*(.1+Math.random()*.35),
      speed:18+Math.random()*10,
      color:COLORS[0|Math.random()*COLORS.length],
      trail:[]
    });
  }

  function explode(x,y,color){
    const count=90+0|Math.random()*40;
    for(let i=0;i<count;i++){
      const angle=Math.PI*2*i/count+Math.random()*.15;
      const spd=2+Math.random()*5;
      particles.push({
        x,y,
        vx:Math.cos(angle)*spd,
        vy:Math.sin(angle)*spd,
        life:1,
        decay:.012+Math.random()*.016,
        size:2+Math.random()*2.5,
        color,
        gravity:.06
      });
    }
    /* sparkle ring */
    for(let i=0;i<24;i++){
      const angle=Math.PI*2*i/24;
      particles.push({
        x,y,
        vx:Math.cos(angle)*8,
        vy:Math.sin(angle)*8,
        life:1,decay:.025,size:1.5,
        color:'#fff',gravity:.04
      });
    }
  }

  let lastRocket=0, raf;
  function frame(t){
    ctx.fillStyle='rgba(10,0,21,.18)';
    ctx.fillRect(0,0,W,H);

    /* spawn rockets periodically */
    if(t-lastRocket>480){ spawnRocket(); lastRocket=t; }

    /* move rockets */
    rockets=rockets.filter(r=>{
      r.trail.push({x:r.x,y:r.y});
      if(r.trail.length>12) r.trail.shift();
      const dx=r.tx-r.x, dy=r.ty-r.y;
      const dist=Math.hypot(dx,dy);
      if(dist<r.speed){ explode(r.x,r.y,r.color); return false; }
      r.x+=dx/dist*r.speed; r.y+=dy/dist*r.speed;
      /* trail */
      r.trail.forEach((p,i)=>{
        const a=i/r.trail.length*.6;
        ctx.globalAlpha=a; ctx.fillStyle=r.color;
        ctx.beginPath(); ctx.arc(p.x,p.y,2,0,Math.PI*2); ctx.fill();
      });
      ctx.globalAlpha=1; ctx.fillStyle=r.color;
      ctx.beginPath(); ctx.arc(r.x,r.y,3,0,Math.PI*2); ctx.fill();
      return true;
    });

    /* move particles */
    particles=particles.filter(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=p.gravity;
      p.vx*=.97; p.vy*=.97;
      p.life-=p.decay;
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
      return p.life>0;
    });
    ctx.globalAlpha=1;
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);

  function dismiss(){
    try{ localStorage.setItem('zeev-seen','1'); }catch(e){}
    cancelAnimationFrame(raf);
    el.classList.add('hiding');
    setTimeout(()=>{ el.remove(); load(); },850);
  }
  el.addEventListener('click', dismiss);
  el.addEventListener('touchend', e=>{ e.preventDefault(); dismiss(); });
})();

load();
setInterval(async()=>{
  const data=await ZeevApp.loadBlessings().catch(()=>null);
  if(data&&data.length!==blessings.length){blessings=shuffle(data);idx=0;showCard();}
},60000);
</script>
</body>
</html>
