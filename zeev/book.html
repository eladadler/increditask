<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎂 יום הולדת שמח זאבי! 🎉</title>
  <meta property="og:title" content="🎂 יום הולדת שמח זאבי! 🎉">
  <meta property="og:description" content="✨ יש לך הפתעה מיוחדת מכל חבריך ✨">
  <meta property="og:image" content="https://eladadler.github.io/increditask/zeev/og.svg">
  <meta property="og:url" content="https://eladadler.github.io/increditask/zeev/book.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Noto Serif Hebrew:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100dvh;overflow-x:hidden}
    body{font-family:'Rubik',sans-serif;background:#fffcf4;color:#1a0e04;direction:rtl}

    /* ===== SHARED OVERLAY ===== */
    .overlay{
      position:fixed;inset:0;z-index:900;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:20px;transition:opacity .7s ease;
    }
    .overlay.hiding{opacity:0;pointer-events:none}

    /* ===== SCREEN 1: PERMISSION ===== */
    #screen-perm{
      background:radial-gradient(ellipse at 50% 60%,#1a0635 0%,#06000f 100%);
    }
    .stars{position:absolute;inset:0;overflow:hidden;pointer-events:none}
    .star{position:absolute;border-radius:50%;background:#fff;
      animation:starTwinkle var(--d,3s) ease-in-out infinite alternate}
    @keyframes starTwinkle{from{opacity:.05}to{opacity:.7}}

    .perm-box{position:relative;z-index:2;text-align:center;max-width:360px}
    .perm-cake-emoji{font-size:72px;line-height:1;margin-bottom:16px;
      animation:cakeWobble 2s ease-in-out infinite}
    @keyframes cakeWobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
    .perm-name{font-family:'Noto Serif Hebrew',serif;font-size:clamp(44px,13vw,72px);
      font-weight:900;color:#ffd700;text-shadow:0 0 40px rgba(255,215,0,.5);margin-bottom:8px}
    .perm-text{font-size:clamp(17px,4.5vw,22px);color:#e8d0ff;line-height:1.55;margin-bottom:28px}
    .perm-btn{
      background:linear-gradient(135deg,#ffd700,#ff9500);
      color:#1a0635;border:none;border-radius:50px;
      padding:16px 36px;font-size:18px;font-weight:700;font-family:'Rubik',sans-serif;
      cursor:pointer;letter-spacing:.3px;
      box-shadow:0 4px 28px rgba(255,180,0,.4);
      transition:transform .1s,box-shadow .15s;
    }
    .perm-btn:active{transform:scale(.96)}
    .perm-btn:hover{box-shadow:0 6px 36px rgba(255,180,0,.6)}
    .perm-skip{margin-top:18px;font-size:13px;color:rgba(200,180,255,.4);cursor:pointer;
      background:none;border:none;font-family:'Rubik',sans-serif;transition:color .15s}
    .perm-skip:hover{color:rgba(200,180,255,.7)}

    /* ===== SCREEN 2: CAKE ===== */
    #screen-cake{
      background:radial-gradient(ellipse at 50% 70%,#1a0635 0%,#06000f 100%);
    }
    #screen-cake canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

    .cake-wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}

    /* tier-1 wraps the candles so they sit ON the cake */
    .tier1-wrap{display:inline-flex;flex-direction:column;align-items:center;width:min(300px,82vw)}

    /* candles */
    .candles-row{display:flex;gap:8px;align-items:flex-end;padding:0 4px;justify-content:center;width:100%}
    .candle{
      display:flex;flex-direction:column;align-items:center;
      width:16px;position:relative;
    }
    /* special "3" and "5" candles */
    .candle-special{width:28px}
    .candle-body-special{
      width:26px;height:58px;border-radius:4px 4px 2px 2px;
      background:linear-gradient(135deg,#ffe566,#ffd700,#ffaa00,#ffd700);
      font-family:'Noto Serif Hebrew',serif;font-size:24px;font-weight:900;
      color:#7a4000;display:flex;align-items:center;justify-content:center;
      text-shadow:0 1px 0 rgba(255,255,255,.4);
      box-shadow:inset -2px 0 4px rgba(0,0,0,.15);
    }
    .flame-wrap{height:26px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
    .flame{
      width:11px;height:18px;
      background:radial-gradient(ellipse at 50% 85%,#fff 0%,#ffd700 30%,#ff7600 70%,transparent 100%);
      border-radius:50% 50% 30% 30%;
      animation:flicker var(--fd,.28s) ease-in-out infinite alternate;
      transform-origin:bottom center;
      transition:transform .2s,opacity .2s;
    }
    @keyframes flicker{
      from{transform:scaleX(1) scaleY(1) rotate(-3deg)}
      to{transform:scaleX(.9) scaleY(1.12) rotate(3deg)}
    }
    .flame.out{display:none}
    .smoke{
      position:absolute;top:-28px;left:50%;transform:translateX(-50%);
      width:6px;height:20px;
      background:linear-gradient(to top,rgba(200,200,200,.5),transparent);
      border-radius:50%;
      animation:smokeRise .8s ease-out forwards;
      display:none;pointer-events:none;
    }
    @keyframes smokeRise{
      0%{opacity:.6;transform:translateX(-50%) scaleX(1) translateY(0)}
      100%{opacity:0;transform:translateX(-50%) scaleX(2) translateY(-20px)}
    }
    .candle-body{
      width:14px;height:44px;
      border-radius:3px 3px 2px 2px;
      position:relative;
    }
    .candle-body::after{content:'';position:absolute;inset:0 3px;
      background:rgba(255,255,255,.25);border-radius:2px}
    .wick{width:2px;height:5px;background:#333;margin-bottom:0;border-radius:1px}

    /* cake */
    .cake-tier{
      position:relative;border-radius:8px 8px 4px 4px;overflow:visible;
    }
    .tier-1{width:min(300px,82vw);height:52px;margin-top:0;
      background:linear-gradient(to bottom,#ff9fb3 0%,#e87090 100%);}
    .tier-2{width:min(340px,90vw);height:58px;margin-top:0;
      background:linear-gradient(to bottom,#ffe4a0 0%,#f0c060 100%);}
    .tier-3{width:min(380px,98vw);height:64px;margin-top:0;
      background:linear-gradient(to bottom,#b8e4ff 0%,#80c4f0 100%);}

    /* frosting drips */
    .tier-1::before,.tier-2::before,.tier-3::before{
      content:'';position:absolute;top:0;left:0;right:0;height:14px;
      background:rgba(255,255,255,.55);
      clip-path:polygon(0 0,100% 0,100% 35%,96% 100%,92% 35%,88% 100%,84% 35%,80% 100%,76% 35%,72% 100%,68% 35%,64% 100%,60% 35%,56% 100%,52% 35%,48% 100%,44% 35%,40% 100%,36% 35%,32% 100%,28% 35%,24% 100%,20% 35%,16% 100%,12% 35%,8% 100%,4% 35%,0 100%);
    }

    .cake-plate{
      width:min(420px,108vw);height:16px;
      background:linear-gradient(to bottom,#e8e0d0,#ccc4b0);
      border-radius:50%;margin-top:-4px;
      box-shadow:0 6px 20px rgba(0,0,0,.3);
    }

    .blow-prompt{
      position:relative;z-index:2;margin-top:24px;
      font-size:clamp(17px,4.5vw,22px);color:#ffd700;font-weight:600;
      text-shadow:0 0 20px rgba(255,215,0,.4);
      text-align:center;line-height:1.5;
      animation:promptPulse 1.5s ease-in-out infinite alternate;
    }
    @keyframes promptPulse{from{opacity:.65}to{opacity:1}}

    .vol-wrap{
      position:relative;z-index:2;margin-top:14px;
      width:min(200px,60vw);height:8px;
      background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;
    }
    #vol-fill{
      height:100%;width:0%;border-radius:4px;
      background:linear-gradient(90deg,#4ecdc4,#ffd700);
      transition:width .08s;
    }
    .vol-label{font-size:11px;color:rgba(255,255,255,.35);margin-top:5px;text-align:center;position:relative;z-index:2}

    /* celebration text after all candles out */
    #cake-yay{
      position:relative;z-index:2;text-align:center;
      font-family:'Noto Serif Hebrew',serif;
      font-size:clamp(28px,8vw,48px);font-weight:900;
      color:#ffd700;text-shadow:0 0 40px rgba(255,215,0,.6);
      opacity:0;transition:opacity .5s;margin-top:20px;
    }
    #cake-yay.show{opacity:1}

    /* ===== MAIN BOOK (same as before) ===== */
    #confetti{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
    .dot{position:absolute;border-radius:50%;animation:twinkle var(--d,3s) ease-in-out infinite alternate}
    @keyframes twinkle{from{opacity:.05}to{opacity:.3}}

    .hero{position:relative;z-index:1;text-align:center;padding:48px 20px 28px}
    .hero-sparkle{font-size:16px;color:#c8900a;letter-spacing:12px;opacity:.6;display:block;margin-bottom:14px}
    .hero-title{font-family:'Noto Serif Hebrew',serif;font-size:clamp(18px,4.5vw,30px);font-weight:700;color:#8a5e08;margin-bottom:2px}
    .hero-num{font-family:'Noto Serif Hebrew',serif;font-size:clamp(64px,20vw,128px);font-weight:900;line-height:1;color:#c8900a;display:block;margin:0 auto 2px;text-shadow:0 4px 32px rgba(200,144,10,.18)}
    .hero-name{font-family:'Noto Serif Hebrew',serif;font-size:clamp(28px,8vw,56px);font-weight:900;color:#6a4008;line-height:1.2;margin-bottom:8px}
    .hero-sub{font-size:13.5px;color:#b07830;opacity:.6;letter-spacing:.5px}
    .hero-line{display:block;width:60px;height:1.5px;background:linear-gradient(90deg,transparent,rgba(200,144,10,.35),transparent);margin:18px auto 0}

    .viewer{position:relative;z-index:1;padding:28px 20px 60px;max-width:560px;margin:0 auto}
    .pages-wrap{position:relative}
    .pages-wrap::before,.pages-wrap::after{content:'';position:absolute;border-radius:20px}
    .pages-wrap::before{inset:5px -5px -5px 5px;z-index:-1;background:#ede0bf}
    .pages-wrap::after{inset:9px -9px -9px 9px;z-index:-2;background:#e8d8b0}

    .stage{position:relative}
    .book-card{position:relative;background:#fff;border-radius:20px;overflow:hidden;
      box-shadow:0 8px 48px rgba(150,90,0,.16),0 2px 8px rgba(150,90,0,.08);border-top:4px solid #c8900a}

    .page-out-next{position:absolute;inset:0;z-index:5;backface-visibility:hidden;
      transform-origin:right center;animation:pageOutNext .65s cubic-bezier(.4,0,.55,1) forwards}
    .page-out-prev{position:absolute;inset:0;z-index:5;backface-visibility:hidden;
      transform-origin:left center;animation:pageOutPrev .65s cubic-bezier(.4,0,.55,1) forwards}
    @keyframes pageOutNext{
      0%{transform:perspective(1200px) rotateY(0deg)}
      48%{transform:perspective(1200px) rotateY(90deg)}
      100%{transform:perspective(1200px) rotateY(175deg);opacity:0}
    }
    @keyframes pageOutPrev{
      0%{transform:perspective(1200px) rotateY(0deg)}
      48%{transform:perspective(1200px) rotateY(-90deg)}
      100%{transform:perspective(1200px) rotateY(-175deg);opacity:0}
    }
    @keyframes revealShadow{from{opacity:1}to{opacity:0}}
    .reveal-shadow{position:absolute;inset:0;border-radius:20px;pointer-events:none;z-index:3;
      background:rgba(0,0,0,.18);animation:revealShadow .65s ease-out forwards}

    .card-media-wrap{overflow:hidden}
    .card-media{width:100%;display:block;object-fit:cover;max-height:320px}
    video.card-media{background:#f5e8cc}
    .card-body{padding:22px 22px 26px}
    .card-sender{font-family:'Noto Serif Hebrew',serif;font-size:16px;font-weight:700;color:#c8900a;margin-bottom:10px;display:flex;align-items:center;gap:8px}
    .card-sender::before{content:'✦';font-size:9px;opacity:.7;flex-shrink:0}
    .card-msg{font-size:15px;line-height:1.78;color:#3a2408;white-space:pre-wrap;word-break:break-word}

    .counter-strip{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:14px}
    .counter-dot{width:7px;height:7px;border-radius:50%;background:rgba(200,144,10,.2);transition:background .3s,transform .3s}
    .counter-dot.active{background:#c8900a;transform:scale(1.3)}

    .nav{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:22px}
    .nav-btn{width:48px;height:48px;border-radius:50%;border:1.5px solid rgba(200,144,10,.35);
      background:#fff;color:#c8900a;font-size:22px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:background .15s,border-color .15s,transform .1s;
      box-shadow:0 2px 12px rgba(150,90,0,.1);user-select:none}
    .nav-btn:hover:not(:disabled){background:#fffbf0;border-color:#c8900a;transform:scale(1.06)}
    .nav-btn:active:not(:disabled){transform:scale(.95)}
    .nav-btn:disabled{opacity:.22;cursor:not-allowed}
    .nav-num{font-size:13px;color:#b07030;min-width:52px;text-align:center;font-weight:500}

    .loader{position:relative;z-index:1;text-align:center;padding:80px 20px}
    .loader-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c8900a;margin:0 4px;animation:bounce 1.2s ease-in-out infinite}
    .loader-dot:nth-child(2){animation-delay:.2s}
    .loader-dot:nth-child(3){animation-delay:.4s}
    @keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.3}40%{transform:scale(1.1);opacity:1}}
    .empty{position:relative;z-index:1;text-align:center;padding:60px 20px;color:#c8a060;font-size:15px}
  </style>
</head>
<body>

<!-- SCREEN 1: mic permission -->
<div id="screen-perm" class="overlay">
  <div class="stars" id="stars"></div>
  <div class="perm-box">
    <div class="perm-cake-emoji">🎂</div>
    <div class="perm-name">זאבי!</div>
    <p class="perm-text">יש לך הפתעה מיוחדת<br>תן הרשאה למיקרופון<br><strong>מה אכפת לך? 😄</strong></p>
    <button class="perm-btn" id="perm-btn">אשר 🎤</button>
    <br>
    <button class="perm-skip" id="perm-skip">כנס בלי מיקרופון</button>
  </div>
</div>

<!-- SCREEN 2: cake + blow -->
<div id="screen-cake" class="overlay" style="display:none">
  <div class="cake-wrap">
    <div class="tier1-wrap">
      <div class="candles-row" id="candles-row"></div>
      <div class="cake-tier tier-1"></div>
    </div>
    <div class="cake-tier tier-2"></div>
    <div class="cake-tier tier-3"></div>
    <div class="cake-plate"></div>
  </div>
  <div class="blow-prompt" id="blow-prompt">פוווווו! כבה את הנרות 🎂</div>
  <div class="vol-wrap"><div id="vol-fill"></div></div>
  <div class="vol-label">עוצמת נשיפה</div>
  <div id="cake-yay">יום הולדת שמח! 🎉✨</div>
</div>

<!-- MAIN BOOK (hidden until candles done) -->
<div id="book-content" style="display:none">
  <div id="confetti"></div>
  <div class="hero">
    <span class="hero-sparkle">✦ ✦ ✦</span>
    <div class="hero-title">יום הולדת שמח</div>
    <span class="hero-num">35</span>
    <div class="hero-name">זאבי</div>
    <div class="hero-sub">מאוהביו ומחבריו</div>
    <span class="hero-line"></span>
  </div>
  <div id="loader" class="loader">
    <div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div>
  </div>
  <div class="viewer" id="viewer" style="display:none">
    <div class="counter-strip" id="dots"></div>
    <div class="pages-wrap">
      <div class="stage" id="stage"></div>
    </div>
    <div class="nav">
      <button class="nav-btn" id="btn-prev" onclick="navigate(-1)" aria-label="הקודם">‹</button>
      <span class="nav-num" id="nav-num"></span>
      <button class="nav-btn" id="btn-next" onclick="navigate(1)" aria-label="הבא">›</button>
    </div>
  </div>
  <div class="empty" id="empty" style="display:none">עוד אין ברכות — הן בדרך ✦</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="zeev.js?v=2"></script>
<script>
/* ===== STARS background ===== */
(function(){
  const s=document.getElementById('stars');
  for(let i=0;i<120;i++){
    const el=document.createElement('div'); el.className='star';
    const sz=1+Math.random()*2.5;
    el.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;opacity:${.05+Math.random()*.3};--d:${1.5+Math.random()*4}s;animation-delay:${Math.random()*5}s`;
    s.appendChild(el);
  }
})();

/* ===== CANDLES ===== */
const CANDLE_COLORS=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff6bdb','#ff9f43','#54a0ff','#b794f4','#48dbfb','#ff9ff3','#ffeaa7','#fd79a8','#00b894','#e17055','#fdcb6e'];
const NUM_CANDLES=10; /* 4 regular + "3" + "5" + 4 regular */

(function buildCandles(){
  const row=document.getElementById('candles-row');
  function mkRegular(i){
    const c=document.createElement('div'); c.className='candle';
    const col=CANDLE_COLORS[i%CANDLE_COLORS.length];
    const dur=(.22+Math.random()*.14).toFixed(2)+'s';
    c.innerHTML=`<div class="flame-wrap"><div class="smoke"></div><div class="flame" style="--fd:${dur}"></div></div><div class="wick"></div><div class="candle-body" style="background:linear-gradient(to right,${col}cc,${col},${col}cc)"></div>`;
    return c;
  }
  function mkSpecial(digit){
    const c=document.createElement('div'); c.className='candle candle-special';
    const dur=(.20+Math.random()*.12).toFixed(2)+'s';
    c.innerHTML=`<div class="flame-wrap"><div class="smoke"></div><div class="flame" style="--fd:${dur};width:13px;height:20px"></div></div><div class="wick"></div><div class="candle-body-special">${digit}</div>`;
    return c;
  }
  for(let i=0;i<4;i++) row.appendChild(mkRegular(i));
  row.appendChild(mkSpecial('5'));
  row.appendChild(mkSpecial('3'));
  for(let i=4;i<8;i++) row.appendChild(mkRegular(i));
})();


/* ===== BLOW DETECTION ===== */
let audioCtx, analyser, audioData, blowRaf;
let candlesLit=NUM_CANDLES, blowTimer=null, allOutDone=false;

function startBlowDetection(stream){
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=256;
  const src=audioCtx.createMediaStreamSource(stream);
  src.connect(analyser);
  audioData=new Uint8Array(analyser.frequencyBinCount);

  let sustainFrames=0;
  function detect(){
    if(allOutDone) return;
    analyser.getByteFrequencyData(audioData);
    const avg=audioData.reduce((a,b)=>a+b,0)/audioData.length;
    const pct=Math.min(100,avg/45*100);
    document.getElementById('vol-fill').style.width=pct+'%';

    if(avg>32){
      sustainFrames++;
      if(sustainFrames>=7 && !blowTimer){
        blowTimer=setInterval(extinguishOne,320);
      }
    } else {
      sustainFrames=0;
      if(blowTimer){ clearInterval(blowTimer); blowTimer=null; }
    }
    blowRaf=requestAnimationFrame(detect);
  }
  blowRaf=requestAnimationFrame(detect);
}

function extinguishOne(){
  if(allOutDone) return;
  const flames=document.querySelectorAll('#candles-row .flame:not(.out)');
  if(!flames.length){ onAllOut(); return; }
  const pick=flames[0|Math.random()*flames.length];
  pick.classList.add('out');
  const smoke=pick.parentElement.querySelector('.smoke');
  if(smoke){ smoke.style.display='block'; setTimeout(()=>smoke.style.display='none',800); }
  candlesLit--;
  if(candlesLit<=0){ clearInterval(blowTimer); blowTimer=null; setTimeout(onAllOut,400); }
}

function onAllOut(){
  if(allOutDone) return; allOutDone=true;
  cancelAnimationFrame(blowRaf);
  if(audioCtx) audioCtx.close();
  document.getElementById('blow-prompt').style.display='none';
  document.getElementById('vol-fill').parentElement.style.display='none';
  document.querySelector('.vol-label').style.display='none';
  const yay=document.getElementById('cake-yay');
  yay.classList.add('show');
  /* small fireworks burst then go to book */
  setTimeout(()=>{ enterBook(); }, 2200);
}

/* ===== SCREEN FLOW ===== */
function enterBook(){
  const cake=document.getElementById('screen-cake');
  cake.classList.add('hiding');
  setTimeout(()=>{
    cake.style.display='none';
    document.getElementById('book-content').style.display='block';
    try{ localStorage.setItem('zeev-seen','1'); }catch(e){}
    initConfetti();
    load();
  },750);
}

function showCake(stream){
  document.getElementById('screen-perm').classList.add('hiding');
  setTimeout(()=>{
    document.getElementById('screen-perm').style.display='none';
    const cake=document.getElementById('screen-cake');
    cake.style.display='flex';
    if(stream) startBlowDetection(stream);
    else {
      /* no mic: just tap to continue */
      document.getElementById('blow-prompt').textContent='לחץ להמשיך ✨';
      document.querySelector('.vol-wrap').style.display='none';
      document.querySelector('.vol-label').style.display='none';
      cake.addEventListener('click',()=>{ if(!allOutDone){ allOutDone=true; enterBook(); } });
    }
  },700);
}

document.getElementById('perm-btn').addEventListener('click',async()=>{
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    showCake(stream);
  }catch(e){
    /* denied or not available */
    showCake(null);
  }
});

document.getElementById('perm-skip').addEventListener('click',()=>{ showCake(null); });

/* if already seen, skip straight to book */
(function(){
  try{ if(localStorage.getItem('zeev-seen')){
    document.getElementById('screen-perm').style.display='none';
    document.getElementById('book-content').style.display='block';
    initConfetti(); load(); return;
  }}catch(e){}
})();

/* ===== CONFETTI (main book background) ===== */
function initConfetti(){
  const c=document.getElementById('confetti');
  if(c.children.length) return;
  const colors=['#c8900a','#e8b820','#8a5e08','#d4a830','#f0cc60'];
  for(let i=0;i<55;i++){
    const d=document.createElement('div'); d.className='dot';
    const sz=2+Math.random()*3.5;
    d.style.cssText=`left:${Math.random()*100}vw;top:${Math.random()*100}vh;width:${sz}px;height:${sz}px;background:${colors[i%colors.length]};--d:${2+Math.random()*5}s;animation-delay:${Math.random()*5}s`;
    c.appendChild(d);
  }
}

/* ===== BOOK LOGIC ===== */
let blessings=[], idx=0, busy=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]]}return a;}

function buildCard(b){
  const card=document.createElement('div'); card.className='book-card';
  if(b.media_url){
    const mw=document.createElement('div'); mw.className='card-media-wrap';
    if(b.media_type==='video'){
      const v=document.createElement('video');
      v.className='card-media'; v.src=b.media_url;
      v.setAttribute('muted',''); v.setAttribute('playsinline',''); v.setAttribute('controls',''); v.setAttribute('preload','metadata');
      mw.appendChild(v);
    } else {
      const img=document.createElement('img');
      img.className='card-media'; img.src=b.media_url; img.alt='תמונה'; img.loading='lazy';
      mw.appendChild(img);
    }
    card.appendChild(mw);
  }
  const body=document.createElement('div'); body.className='card-body';
  const name=document.createElement('div'); name.className='card-sender'; name.textContent=b.name;
  body.appendChild(name);
  if(b.message){const m=document.createElement('div'); m.className='card-msg'; m.textContent=b.message; body.appendChild(m);}
  card.appendChild(body);
  return card;
}

function updateUI(){
  document.getElementById('nav-num').textContent=(idx+1)+' / '+blessings.length;
  document.getElementById('btn-prev').disabled=blessings.length<=1;
  document.getElementById('btn-next').disabled=blessings.length<=1;
  const max=Math.min(blessings.length,12);
  const dots=document.getElementById('dots'); dots.innerHTML='';
  if(blessings.length>1) for(let i=0;i<max;i++){
    const d=document.createElement('div'); d.className='counter-dot'+(i===idx%max?' active':'');
    dots.appendChild(d);
  }
}

function showCard(){
  const stage=document.getElementById('stage'); stage.innerHTML='';
  stage.appendChild(buildCard(blessings[idx])); updateUI();
}

function navigate(dir){
  if(busy||blessings.length<=1) return; busy=true;
  const stage=document.getElementById('stage');
  const curCard=stage.firstChild;
  if(!curCard){busy=false;return;}
  const newIdx=(idx+dir+blessings.length)%blessings.length;
  stage.style.height=curCard.offsetHeight+'px';
  const newCard=buildCard(blessings[newIdx]);
  const shd=document.createElement('div'); shd.className='reveal-shadow';
  newCard.appendChild(shd);
  stage.insertBefore(newCard,curCard);
  curCard.style.position='absolute'; curCard.style.top='0'; curCard.style.left='0'; curCard.style.right='0'; curCard.style.zIndex='5';
  requestAnimationFrame(()=>{ curCard.classList.add(dir>0?'page-out-next':'page-out-prev'); });
  setTimeout(()=>{
    idx=newIdx; curCard.remove(); shd.remove();
    newCard.style.cssText=''; stage.style.height=''; updateUI(); busy=false;
  },680);
}

async function load(){
  try{
    const data=shuffle(await ZeevApp.loadBlessings());
    document.getElementById('loader').style.display='none';
    if(!data.length){document.getElementById('empty').style.display='block';return;}
    blessings=data;
    document.getElementById('viewer').style.display='block';
    showCard();
  }catch(e){
    document.getElementById('loader').innerHTML='<span style="color:#c04020;font-size:14px">שגיאה: '+e.message+'</span>';
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') navigate(1);
  if(e.key==='ArrowRight') navigate(-1);
});
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50) navigate(dx<0?1:-1);
},{passive:true});

setInterval(async()=>{
  if(!blessings.length) return;
  const data=await ZeevApp.loadBlessings().catch(()=>null);
  if(data&&data.length!==blessings.length){blessings=shuffle(data);idx=0;showCard();}
},60000);
</script>
</body>
</html>
