<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8ec"/>
      <stop offset="100%" stop-color="#fef0d0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8900a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c8900a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="315" rx="520" ry="280" fill="url(#glow)"/>

  <!-- gold border -->
  <rect x="20" y="20" width="1160" height="590" rx="24"
        fill="none" stroke="#c8900a" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- decorative dots -->
  <g fill="#c8900a" opacity="0.35">
    <circle cx="80" cy="80" r="5"/>
    <circle cx="160" cy="45" r="3"/>
    <circle cx="300" cy="70" r="4"/>
    <circle cx="500" cy="35" r="3.5"/>
    <circle cx="700" cy="40" r="3"/>
    <circle cx="900" cy="60" r="4.5"/>
    <circle cx="1050" cy="45" r="3"/>
    <circle cx="1120" cy="85" r="5"/>
    <circle cx="100" cy="550" r="4"/>
    <circle cx="260" cy="580" r="3"/>
    <circle cx="940" cy="570" r="4"/>
    <circle cx="1100" cy="540" r="3.5"/>
  </g>

  <!-- top sparkle -->
  <text x="600" y="100" text-anchor="middle" font-family="serif"
        font-size="30" fill="#c8900a" opacity="0.6">✦ ✦ ✦</text>

  <!-- emoji -->
  <text x="600" y="200" text-anchor="middle" font-size="80" font-family="serif">🎉</text>

  <!-- main title -->
  <text x="600" y="300" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="72" font-weight="900"
        fill="#6a4008" direction="rtl">שלח ברכה לזאבי!</text>

  <!-- subtitle -->
  <text x="600" y="375" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="38"
        fill="#b07830" direction="rtl">כתוב לו, שלח תמונה, שתף סרטון מצחיק</text>

  <!-- call to action -->
  <rect x="350" y="420" width="500" height="72" rx="36"
        fill="#c8900a"/>
  <text x="600" y="464" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="34" font-weight="700"
        fill="#ffffff" direction="rtl">✦ ביחד נפתיע אותו ✦</text>

  <!-- bottom -->
  <text x="600" y="565" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="24"
        fill="#c8900a" opacity="0.5" direction="rtl">מתנה מהלב מכל חבריו ♥</text>
</svg>
